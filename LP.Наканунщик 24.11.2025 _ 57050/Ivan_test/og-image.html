<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OG Image - KINETICA</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 1200px;
            height: 630px;
            background: linear-gradient(135deg, #d4ff00 0%, #00ccff 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            overflow: hidden;
            position: relative;
        }
        
        .container {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 80px;
            text-align: center;
            position: relative;
            z-index: 2;
        }
        
        .logo {
            font-size: 120px;
            font-weight: 900;
            color: #000;
            margin-bottom: 40px;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            line-height: 1;
        }
        
        .title {
            font-size: 48px;
            font-weight: 900;
            color: #000;
            margin-bottom: 30px;
            line-height: 1.2;
            max-width: 1000px;
        }
        
        .subtitle {
            font-size: 32px;
            font-weight: 700;
            color: #333;
            max-width: 900px;
            line-height: 1.4;
        }
        
        .decorative {
            position: absolute;
            opacity: 0.1;
        }
        
        .star1 {
            top: 50px;
            left: 100px;
            width: 150px;
            height: 150px;
        }
        
        .star2 {
            bottom: 80px;
            right: 120px;
            width: 120px;
            height: 120px;
        }
        
        .star3 {
            top: 200px;
            right: 200px;
            width: 100px;
            height: 100px;
        }
    </style>
</head>
<body>
    <div class="decorative star1">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z" fill="#000"/>
        </svg>
    </div>
    <div class="decorative star2">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z" fill="#000"/>
        </svg>
    </div>
    <div class="decorative star3">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 0L14.59 9.41L24 12L14.59 14.59L12 24L9.41 14.59L0 12L9.41 9.41L12 0Z" fill="#000"/>
        </svg>
    </div>
    
    <div class="container">
        <div class="logo">KINETICA</div>
        <div class="title">Пакет «Успеть всё»</div>
        <div class="subtitle">Скоростной запуск email-проектов для директоров по маркетингу</div>
    </div>
</body>
</html>
