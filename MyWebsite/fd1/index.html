<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сертификат - Иван Дербугов</title>
    <meta name="description" content="Сертификат об обучении Ивана Дербугова">
    <meta name="author" content="Иван Дербугов">
    <meta name="robots" content="index, follow">

    <!-- Иконки для вкладки браузера -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" href="favicon.svg">

    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            color: #1f2937;

            /* Светлая тема "Мятное облако" как на основном сайте */
            background: linear-gradient(-45deg, #82dfca, #c5f1f9, #f5fbf9, #f0f8f8);
            background-size: 400% 400%;
            animation: gradientAnimation 10s ease infinite;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        @keyframes gradientAnimation {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
            animation: fadeIn 0.8s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            font-size: 2.5rem;
            color: #079e7b;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .certificate-image {
            width: 100%;
            height: auto;
            border-radius: 20px;
            display: block;
            box-shadow: 0 10px 40px rgba(7, 158, 123, 0.3), 0 5px 20px rgba(0, 0, 0, 0.15);
            margin-bottom: 40px;
            transition: all 0.3s ease;
        }

        .certificate-image:hover {
            box-shadow: 0 15px 50px rgba(7, 158, 123, 0.4), 0 8px 30px rgba(0, 0, 0, 0.2);
            transform: translateY(-5px);
        }

        .cta-button {
            display: inline-block;
            background: linear-gradient(135deg, #079e7b, #08b992);
            color: #fff;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 18px 40px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 6px 25px rgba(7, 158, 123, 0.4);
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            background: linear-gradient(135deg, #08b992, #079e7b);
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(7, 158, 123, 0.5);
        }

        .cta-button:active {
            transform: translateY(-1px);
        }

        footer {
            margin-top: 40px;
            color: #6b7280;
            font-size: 0.9rem;
        }

        /* Адаптивность для мобильных устройств */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
                margin-bottom: 20px;
            }

            .cta-button {
                font-size: 1.1rem;
                padding: 15px 35px;
            }
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 1.5rem;
            }

            .cta-button {
                font-size: 1rem;
                padding: 12px 30px;
            }

            .certificate-image {
                border-radius: 10px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Сертификат</h1>

        <img src="Сертификат.png" alt="Сертификат Иван Дербугов" class="certificate-image">

        <a href="https://derbugov.ru" class="cta-button">Узнать больше обо мне</a>

        <footer>
            <p>&copy; <span id="currentYear"></span> Иван Дербугов</p>
        </footer>
    </div>

    <script>
        // Автоматически вставляем текущий год
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
</body>

</html>
