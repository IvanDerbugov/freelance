<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель - Логи заявок</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .stat-card h3 {
            font-size: 14px;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-card .value {
            font-size: 36px;
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
        }

        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: white;
        }

        .btn-info {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        button:active {
            transform: translateY(0);
        }

        .filter-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-section label {
            font-weight: 600;
            color: #333;
        }

        .filter-section select {
            padding: 8px 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: border-color 0.3s;
        }

        .filter-section select:focus {
            outline: none;
            border-color: #667eea;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
        }

        thead {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }

        td {
            padding: 15px;
            border-bottom: 1px solid #f0f0f0;
            font-size: 14px;
        }

        tr:hover {
            background-color: #f8f9ff;
        }

        .status {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            display: inline-block;
        }

        .status-success {
            background: #d4edda;
            color: #155724;
        }

        .status-error {
            background: #f8d7da;
            color: #721c24;
        }

        .status-network {
            background: #fff3cd;
            color: #856404;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 120px;
            height: 120px;
            margin-bottom: 20px;
            opacity: 0.3;
        }

        .empty-state h3 {
            font-size: 24px;
            margin-bottom: 10px;
        }

        .copy-btn {
            background: transparent;
            border: 1px solid #667eea;
            color: #667eea;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
            border-radius: 4px;
            margin-left: 5px;
            transition: all 0.2s;
        }

        .copy-btn:hover {
            background: #667eea;
            color: white;
            transform: none;
        }

        .log-detail {
            font-size: 12px;
            color: #666;
            word-break: break-word;
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 10px 8px;
            }

            .controls {
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Админ-панель</h1>
        <p class="subtitle">Система мониторинга заявок с сайта</p>

        <div class="stats">
            <div class="stat-card">
                <h3>Всего заявок</h3>
                <div class="value" id="totalLogs">0</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);">
                <h3>Успешных</h3>
                <div class="value" id="successLogs">0</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);">
                <h3>Ошибок</h3>
                <div class="value" id="errorLogs">0</div>
            </div>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="loadLogs()">🔄 Обновить</button>
            <button class="btn-success" onclick="exportLogs()">💾 Экспорт JSON</button>
            <button class="btn-info" onclick="exportToCSV()">📊 Экспорт CSV</button>
            <button class="btn-danger" onclick="clearAllLogs()">🗑️ Очистить все</button>
        </div>

        <div class="filter-section">
            <label for="statusFilter">Фильтр по статусу:</label>
            <select id="statusFilter" onchange="filterLogs()">
                <option value="all">Все</option>
                <option value="SUCCESS">Успешные</option>
                <option value="TELEGRAM_ERROR">Ошибки Telegram</option>
                <option value="NETWORK_ERROR">Ошибки сети</option>
            </select>

            <label for="sortBy">Сортировка:</label>
            <select id="sortBy" onchange="filterLogs()">
                <option value="newest">Сначала новые</option>
                <option value="oldest">Сначала старые</option>
            </select>
        </div>

        <div id="logsContainer"></div>
    </div>

    <script src="../js/send-form.js"></script>
    <script>
        let allLogs = [];

        function loadLogs() {
            allLogs = window.FormHandler.getAllLogs();
            updateStats();
            filterLogs();
        }

        function updateStats() {
            const total = allLogs.length;
            const success = allLogs.filter(log => log.status === 'SUCCESS').length;
            const errors = allLogs.filter(log => log.status !== 'SUCCESS').length;

            document.getElementById('totalLogs').textContent = total;
            document.getElementById('successLogs').textContent = success;
            document.getElementById('errorLogs').textContent = errors;
        }

        function filterLogs() {
            const statusFilter = document.getElementById('statusFilter').value;
            const sortBy = document.getElementById('sortBy').value;

            let filteredLogs = [...allLogs];

            // Фильтрация
            if (statusFilter !== 'all') {
                filteredLogs = filteredLogs.filter(log => log.status === statusFilter);
            }

            // Сортировка
            filteredLogs.sort((a, b) => {
                const dateA = new Date(a.timestamp);
                const dateB = new Date(b.timestamp);
                return sortBy === 'newest' ? dateB - dateA : dateA - dateB;
            });

            renderLogs(filteredLogs);
        }

        function renderLogs(logs) {
            const container = document.getElementById('logsContainer');

            if (logs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
                        </svg>
                        <h3>Нет логов</h3>
                        <p>Заявки с сайта будут отображаться здесь</p>
                    </div>
                `;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Дата и время</th>
                            <th>Email</th>
                            <th>Проект</th>
                            <th>Сроки</th>
                            <th>Статус</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            logs.forEach(log => {
                const date = new Date(log.timestamp);
                const formattedDate = date.toLocaleString('ru-RU', {
                    day: '2-digit',
                    month: '2-digit',
                    year: 'numeric',
                    hour: '2-digit',
                    minute: '2-digit',
                    second: '2-digit'
                });

                const statusClass = log.status === 'SUCCESS' ? 'status-success' :
                                  log.status === 'NETWORK_ERROR' ? 'status-network' : 'status-error';

                html += `
                    <tr>
                        <td>${formattedDate}</td>
                        <td>
                            ${log.email || 'N/A'}
                            <button class="copy-btn" onclick="copyToClipboard('${log.email}')">📋</button>
                        </td>
                        <td><div class="log-detail">${log.project || 'N/A'}</div></td>
                        <td>${log.deadline || 'Не указаны'}</td>
                        <td>
                            <span class="status ${statusClass}">${log.status}</span>
                            ${log.error ? `<div class="log-detail" style="color: #e74c3c; margin-top: 5px;">${log.error}</div>` : ''}
                        </td>
                    </tr>
                `;
            });

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
        }

        function exportLogs() {
            window.FormHandler.exportLogsToFile();
        }

        function exportToCSV() {
            if (allLogs.length === 0) {
                alert('Нет логов для экспорта');
                return;
            }

            const headers = ['Дата', 'Email', 'Проект', 'Сроки', 'Статус', 'Ошибка'];
            const rows = allLogs.map(log => {
                const date = new Date(log.timestamp).toLocaleString('ru-RU');
                return [
                    date,
                    log.email || '',
                    log.project || '',
                    log.deadline || '',
                    log.status,
                    log.error || ''
                ].map(field => `"${String(field).replace(/"/g, '""')}"`).join(',');
            });

            const csv = [headers.join(','), ...rows].join('\n');
            const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `form-logs-${new Date().toISOString().split('T')[0]}.csv`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        }

        function clearAllLogs() {
            if (confirm('⚠️ Вы уверены, что хотите удалить ВСЕ логи? Это действие нельзя отменить!')) {
                if (confirm('Последнее предупреждение! Все данные будут безвозвратно удалены.')) {
                    window.FormHandler.clearLogs();
                    loadLogs();
                    alert('✅ Все логи успешно удалены');
                }
            }
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                // Временно меняем текст кнопки
                event.target.textContent = '✓';
                setTimeout(() => {
                    event.target.textContent = '📋';
                }, 1000);
            });
        }

        // Загружаем логи при открытии страницы
        loadLogs();

        // Автообновление каждые 30 секунд
        setInterval(loadLogs, 30000);
    </script>
</body>
</html>
